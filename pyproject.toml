[project]
name = "epoint"
version = "0.2.1"
description = "Python client for the epoint.az payment gateway"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "martian56" }]
keywords = ["epoint", "epoint-az", "payment", "gateway", "azerbaijan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/martian56/epoint-python"
Repository = "https://github.com/martian56/epoint-python"
Sandbox = "https://github.com/martian56/epoint-sandbox"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "mypy>=1.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epoint"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["sandbox: needs a running epoint sandbox on EPOINT_BASE_URL"]
